<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | PawMatch</title>
    <link rel="stylesheet" href="css/registro.css">
    <script src="js/registro.js" defer></script>
</head>

<body>
    <header class="encabezado">
        <a class="marca" href="index.html">🐾 PawMatch</a>
        <a class="enlace-regreso" href="login.html">Ya tengo una cuenta</a>
    </header>

    <main>
        <section class="panel-registro">
            <p class="etiqueta">Únete a PawMatch</p>
            <h1>Crear cuenta de adoptante</h1>
            <p class="introduccion">
                Regístrate para enviar solicitudes y seguir su estado.
            </p>

            <form id="form-registro">
                <div class="campo">
                    <label for="nombres">Nombres *</label>
                    <input
                        type="text"
                        id="nombres"
                        maxlength="100"
                        autocomplete="given-name"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="apellidos">Apellidos *</label>
                    <input
                        type="text"
                        id="apellidos"
                        maxlength="100"
                        autocomplete="family-name"
                        required
                    >
                </div>

                <div class="campo campo-completo">
                    <label for="correo">Correo electrónico *</label>
                    <input
                        type="email"
                        id="correo"
                        maxlength="150"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="campo campo-completo">
                    <label for="contrasena">Contraseña *</label>
                    <input
                        type="password"
                        id="contrasena"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                    <small>Debe tener al menos 8 caracteres.</small>
                </div>

                <div class="campo">
                    <label for="telefono">Teléfono</label>
                    <input
                        type="tel"
                        id="telefono"
                        maxlength="20"
                        autocomplete="tel"
                    >
                </div>

                <div class="campo">
                    <label for="direccion">Dirección</label>
                    <input
                        type="text"
                        id="direccion"
                        maxlength="255"
                        autocomplete="street-address"
                    >
                </div>

                <button type="submit">Crear cuenta</button>
            </form>

            <p id="mensaje-registro" role="status" aria-live="polite"></p>
        </section>
    </main>

    <footer>
        <p>PawMach · Refugio Huellitas</p>
    </footer>
</body>
</html>
