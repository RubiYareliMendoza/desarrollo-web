<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawMach | Solicitudes de adopción</title>
    <link rel="stylesheet" href="css/solicitudes.css">
    <script src="js/solicitudes.js?v=2" defer></script>
</head>

<body>
    <header class="encabezado">
        <h1>🐾 PawMatch</h1>

        <nav aria-label="Navegación principal">
            <a href="mascotas.html">Mascotas</a>
           
            <a id="enlace-usuarios" href="usuarios.html" hidden>
                Administrar usuarios
            </a>
            <button id="cerrar-sesion" type="button">
                Cerrar sesión
            </button>
        </nav>
    </header>

    <main>
        <section class="bienvenida">
            <h2 id="titulo-bienvenida">Tu próxima historia comienza aquí</h2>
            <p id="descripcion-bienvenida">
                Envía tu solicitud de adopción y consulta aquí su estado.
            </p>
        </section>

        <p id="mensaje-general" role="status"></p>

        <section id="seccion-adoptante" class="panel-solicitudes" hidden>
            <h2>Solicitar una adopción</h2>

            <form id="form-solicitud">
                <div class="campo-solicitud">
                    <label for="mascota">Mascota disponible</label>
                    <select id="mascota" required>
                        <option value="">Cargando mascotas...</option>
                    </select>
                </div>

                <div class="campo-solicitud">
                    <label for="mensaje-solicitud">
                        Mensaje para el refugio
                    </label>
                    <textarea id="mensaje-solicitud" maxlength="2000"></textarea>
                </div>

                <button type="submit">Enviar solicitud</button>
            </form>

            <h2 id="mis-solicitudes">Mis solicitudes</h2>
            <div id="lista-mis-solicitudes"></div>
        </section>

        <section id="seccion-administrador"
                 class="panel-solicitudes"
                 hidden>
            <h2>Solicitudes pendientes</h2>
            <div id="lista-pendientes"></div>
        </section>
    </main>

    <footer class="pie-pagina">
        <p>Huellitas - Sistema de adopción de mascotas</p>
    </footer>
</body>
</html>
